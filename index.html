<style>
@font-face{font-family:"Hanken Grotesk";font-weight:400;font-display:swap;src:url(fonts/hg-400.woff2) format("woff2")}
@font-face{font-family:"Hanken Grotesk";font-weight:600;font-display:swap;src:url(fonts/hg-600.woff2) format("woff2")}
@font-face{font-family:"Hanken Grotesk";font-weight:700;font-display:swap;src:url(fonts/hg-700.woff2) format("woff2")}
@font-face{font-family:"Hanken Grotesk";font-weight:800;font-display:swap;src:url(fonts/hg-800.woff2) format("woff2")}

/* VOICE: plain and friendly, a pocket tool you check on the bus
   IDEA: a shift rota pinned on the warehouse wall: sun-yellow earlies, evening-indigo lates
   PICTURE: your next pay in one big number; the month as a grid of coloured days
   COLOUR and TYPE: clean paper ground, cobalt for actions, sun yellow and indigo for shifts, coral for leave; Hanken Grotesk
   LAYOUT: one narrow column, everything stacked, tab bar at the bottom, edits open in a sheet from below */
:root{color-scheme:light;--bg:#f3f4f7;--card:#fff;--soft:#eceef3;--line:#e2e5eb;--ink:#14171d;--mute:#667085;--acc:#2f5bea;--accInk:#fff;--accSoft:#e3e9fd;
 --early:#ffc84a;--earlyInk:#3a2a00;--late:#3d41a3;--lateInk:#fff;--leave:#ff7d6e;--leaveInk:#3a0d07;--neg:#c4304a;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 8px rgba(16,24,40,.04)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#0f1115;--card:#1a1d23;--soft:#262a32;--line:#2c313a;--ink:#f1f3f7;--mute:#9aa3b2;--acc:#86a2ff;--accInk:#0f1115;--accSoft:#25304f;--late:#6d72e6;--neg:#ff8a9b;--shadow:none}}
:root[data-theme=dark]{color-scheme:dark;--bg:#0f1115;--card:#1a1d23;--soft:#262a32;--line:#2c313a;--ink:#f1f3f7;--mute:#9aa3b2;--acc:#86a2ff;--accInk:#0f1115;--accSoft:#25304f;--late:#6d72e6;--neg:#ff8a9b;--shadow:none}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
*{touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Hanken Grotesk",system-ui,-apple-system,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
main{max-width:600px;margin:auto;padding:18px 16px 120px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);padding:4px 6px calc(4px + env(safe-area-inset-bottom))}
nav.tabs .in{display:flex;max-width:600px;margin:auto}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:54px;padding:6px 0;border:0;background:none;color:var(--mute);font-size:12px;font-weight:600}
nav.tabs button.on{color:var(--acc)}
nav.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.top{display:flex;align-items:center;gap:12px;margin:6px 0 16px}
.top .t{flex:1;min-width:0}.top.c .t{text-align:center}
h1{font-size:28px;line-height:1.1;margin:0;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:17px;margin:0;font-weight:700}
.sub,.lab{font-size:14px;color:var(--mute)}
.circ{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:22px;line-height:1;display:grid;place-items:center}
.circ:disabled{opacity:.3}
.card{display:block;width:100%;text-align:left;background:var(--card);border:0;border-radius:20px;padding:18px;margin:0 0 12px;box-shadow:var(--shadow);color:var(--ink)}
:root[data-theme=dark] .card{border:1px solid var(--line)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .card{border:1px solid var(--line)}}
.hero{background:var(--acc);color:var(--accInk);border:0!important}
.hero .lab{color:inherit;opacity:.8}
.big{font-size:clamp(46px,13vw,64px);font-weight:800;letter-spacing:-.035em;line-height:1;margin:10px 0 6px;white-space:nowrap}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.trio div{background:rgba(255,255,255,.16);border-radius:12px;padding:8px 10px}
.trio small{display:block;font-size:12px;opacity:.8}.trio b{font-size:15px;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:50px;padding:0 20px;border-radius:14px;border:0;background:var(--soft);color:var(--ink);font-weight:700;white-space:nowrap}
.btn.pri{background:var(--acc);color:var(--accInk)}
.btn.blk{display:flex;width:100%}
.btn.xl{min-height:58px;font-size:18px;margin-bottom:12px}
.btn.link{background:none;color:var(--acc);padding:0 2px;min-height:44px}
.btn.red{background:none;color:var(--neg);padding:0 2px;min-height:44px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile .v{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px;line-height:1.15}
.go{display:flex;align-items:center;justify-content:space-between;gap:12px}
.go .v{font-size:22px;font-weight:800}
.chev{font-size:22px;color:var(--mute)}
.ln{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.ln:first-child{border-top:0;padding-top:2px}
.ln>span:first-child{flex:1;min-width:0}
.ln .r{text-align:right;white-space:nowrap;font-weight:700;font-variant-numeric:tabular-nums}
.ln .s{display:block;font-size:13px;color:var(--mute);font-weight:400}
.ln.tot{font-weight:800;font-size:18px}
.ln.btnln{width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;color:var(--ink);padding-left:0;padding-right:0}
.sec{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--mute);margin:18px 0 4px}
.neg{color:var(--neg)}
.tag{display:inline-block;font-size:12px;font-weight:700;line-height:1.6;padding:0 8px;border-radius:99px;background:var(--soft);color:var(--mute);vertical-align:1px;white-space:nowrap}
.tag.acc{background:var(--accSoft);color:var(--acc)}
.hint{background:var(--accSoft);color:var(--ink);border-radius:14px;padding:12px 14px;margin:0 0 12px;font-size:15px}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden;display:flex;margin:14px 0 8px}
.bar i{display:block;height:100%}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dh{text-align:center;font-size:12px;font-weight:700;color:var(--mute);padding-bottom:2px}
.day{position:relative;height:clamp(48px,12.5vw,62px);border:0;border-radius:12px;background:var(--card);color:var(--ink);font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;box-shadow:var(--shadow)}
.day.E{background:var(--early);color:var(--earlyInk)}
.day.L{background:var(--late);color:var(--lateInk)}
.day.AL{background:var(--leave);color:var(--leaveInk)}
.day.HE{background:linear-gradient(135deg,var(--leave) 50%,var(--early) 50%);color:var(--leaveInk)}
.day.HL{background:linear-gradient(135deg,var(--leave) 50%,var(--late) 50%);color:var(--leaveInk)}
.day.SK{background:transparent;box-shadow:inset 0 0 0 1.5px var(--mute)}
.day.BH{background:transparent;box-shadow:inset 0 0 0 1.5px var(--mute)}
.day small{font-size:9.5px;font-weight:700;color:var(--mute);line-height:1}
.day.out{opacity:.3}
.day.today{outline:2.5px solid var(--ink);outline-offset:2px}
.day .ot{font-size:10.5px;line-height:1;padding:2px 5px;border-radius:99px;background:var(--ink);color:var(--bg);font-weight:800}
.day.bs::before{content:"";position:absolute;left:-5px;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--acc)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--mute);margin:14px 0 16px}
.sw{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:5px}
.ov{position:fixed;inset:0;background:rgba(10,12,18,.45);display:none;align-items:flex-end;justify-content:center;z-index:30}
.ov.on{display:flex}
.sheet{background:var(--card);width:min(560px,100%);max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom))}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:24px}}
@media(prefers-reduced-motion:no-preference){.ov.on .sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.5}}}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:14px}.sh .t{flex:1;text-align:center}
.f{display:block;margin:0 0 14px}
.f>span{display:block;font-size:14px;font-weight:600;color:var(--mute);margin-bottom:6px}
input,select,textarea{display:block;width:100%;max-width:100%;font:inherit;font-size:17px;min-height:50px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);-webkit-appearance:none;appearance:none;margin:0}
input[type=date]{line-height:48px;text-align:left}
input::-webkit-date-and-time-value{text-align:left}
textarea{padding:12px;min-height:120px;font-size:16px}
:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 12px}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{flex:1;min-height:44px;border:0;border-radius:10px;background:transparent;font-weight:700;padding:4px 6px;line-height:1.15}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.seg button small{display:block;font-weight:500;font-size:12px;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chips button{min-height:42px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:15px}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.step{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.step button{flex:none;width:58px;height:58px;border-radius:16px;border:0;background:var(--soft);font-size:28px;font-weight:600}
.step .val{flex:1;text-align:center;font-size:44px;font-weight:800;letter-spacing:-.03em}
.yt{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}.yt th,.yt td{padding:11px 0;border-top:1px solid var(--line);text-align:left;font-weight:500}.yt tr:first-child th{border-top:0;padding-top:0;font-size:14px;color:var(--mute);font-weight:700}.yt .n{text-align:right;white-space:nowrap;padding-left:12px}.yt .s{display:block;font-weight:500;font-size:12px}.yt .tk td{font-weight:800;font-size:17px}
.bars{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;align-items:end;height:150px;margin:8px 0 6px;border-bottom:1px solid var(--line)}
.bars button{height:100%;border:0;background:none;padding:0;display:flex;align-items:flex-end;cursor:pointer}
.bars i{display:block;width:100%;border-radius:4px 4px 0 0;background:var(--acc);min-height:2px}
.bars i.e{background:var(--accSoft);box-shadow:inset 0 0 0 1.5px var(--acc)}
.bars button.sel i{background:var(--ink)}.bars button.sel i.e{background:var(--soft);box-shadow:inset 0 0 0 1.5px var(--ink)}
.bl{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;font-size:11px;color:var(--mute);text-align:center;font-weight:700}
.cap{display:flex;justify-content:space-between;align-items:baseline;gap:8px;min-height:24px}.cap b{font-size:18px;white-space:nowrap}
.key{display:flex;gap:14px;font-size:12px;color:var(--mute);margin-top:8px}.key i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.pv{background:var(--soft);border-radius:14px;padding:12px 14px;margin-bottom:16px}
.pv b{font-size:22px}
.lbl{font-size:14px;font-weight:700;color:var(--mute);margin:4px 0 8px}
.mcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:12px}
.md{height:44px;border:0;border-radius:10px;background:transparent;font-weight:700;font-size:15px;position:relative}
.md.in{background:var(--accSoft)}
.md.edge{background:var(--acc);color:var(--accInk)}
.md.pay::after{content:"£";position:absolute;right:3px;top:1px;font-size:10px;font-weight:800;color:var(--neg)}
.md.payd{box-shadow:inset 0 0 0 2px var(--neg)}
.md.out{opacity:.35}
.flash{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;z-index:40;max-width:90vw;text-align:center}
.foot{text-align:center;font-size:13px;color:var(--mute);margin-top:18px}
@media(max-width:380px){.trio b{font-size:13.5px}.day{font-size:14px}.cal{gap:4px}.day .ot{font-size:9.5px;padding:2px 3px}}
</style>

<body>
<main id="app" aria-live="polite"></main>
<nav class="tabs" aria-label="Sections"><div class="in">
 <button data-tab="home"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Pay</button>
 <button data-tab="cal"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Rota</button>
 <button data-tab="leave"><svg viewBox="0 0 24 24"><path d="M4 20h16M6 20c0-6 3-10 6-10s6 4 6 10M12 10V4M9 6l3-2 3 2"/></svg>Holidays</button>
 <button data-tab="tax"><svg viewBox="0 0 24 24"><path d="M4 21V8l8-5 8 5v13z"/><path d="M9 21v-6h6v6M8 11h8"/></svg>Tax</button>
 <button data-tab="set"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Setup</button>
</div></nav>
<div class="ov" id="ov"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<script>
{
/* ================= helpers ================= */
const CATS={b15:'Basic 1.5',b2:'Basic DB',s15:'Basic 1/6 Shift x 1.5',s2:'Basic 1/6 Shift x 2'};
const CORD=['b15','b2','s15','s2'];
const STS={work:'Worked shift',off:'Day off',leave:'Holiday',half:'Half-day holiday',hrs:'Holiday (hours)',sick:'Sick',bank:'Bank holiday'};
const isLv=st=>st==='leave'||st==='half'||st==='hrs';
const lvFrac=x=>!x?0:x.st==='leave'?1:x.st==='half'?.5:x.st==='hrs'?(x.lvm|0)/S.set.dayMins:0;
const pad=n=>String(n).padStart(2,'0');
const D=s=>{const[y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)};
const iso=t=>new Date(t).toISOString().slice(0,10);
const add=(s,n)=>iso(D(s)+n*864e5);
const dow=s=>new Date(D(s)).getUTCDay();
const todayISO=()=>{const n=new Date();return n.getFullYear()+'-'+pad(n.getMonth()+1)+'-'+pad(n.getDate())};
const fd=(s,o)=>s?new Date(D(s)).toLocaleDateString('en-GB',Object.assign({timeZone:'UTC',day:'numeric',month:'short'},o||{})):'TBC';

 const cat=x.cat||(elig?(mul===2?'s2':'s15'):(mul===2?'b2':'b15'));const rate=rateAt(d)[cat];

 {const y=+pm.slice(0,4),seen=new Set();for(const p of [buyFor(y),buyFor(y-1),buyFor(y+1)]){if(!p||seen.has(p.ly))continue;seen.add(p.ly);const n=Math.max(1,parseInt(p.inst)||5),c=buyCost(p),first=p.first||p.ly+'-04';if(!(c>0))continue;

function taxDue(ytdP,tm,ty){const c=cfg(ty),A=allowance()??12579;
